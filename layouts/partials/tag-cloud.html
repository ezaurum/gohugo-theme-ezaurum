<h2 class="block-title">자주 쓴 태그</h2>
<ul class="chips">
    {{ range site.Taxonomies.tags.ByCount }}
        {{ if and (ge .Count 10) (not (in (slice "hugo" "tags" "rss") .Term)) }}
        <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}<span class="count">{{ .Count }}</span></a></li>
        {{ end }}
    {{ end }}
</ul>
<p><a href="/tags/">모든 태그 보기 →</a></p>
